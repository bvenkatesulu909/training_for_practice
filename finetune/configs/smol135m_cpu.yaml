# Runnable on the i3 laptop. 135M base, LoRA r=16 -> ~1.5M trainable params.
# This is a real fine-tune, not a toy: the base model has never seen this codebase.
name: smol135m_cpu
base_model: HuggingFaceTB/SmolLM2-135M-Instruct

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  train_embeddings: false

data:
  train_file: data/train.jsonl
  val_file: data/val.jsonl
  max_len: 512
  on_overflow: drop
  mask_prompt: true

train:
  out_dir: runs/smol135m
  epochs: 1.0
  micro_batch: 1
  grad_accum: 4          # 4 examples/step; small because RAM is ~3 GB free
  lr: 2.0e-4
  warmup_frac: 0.05
  weight_decay: 0.0
  grad_clip: 1.0
  dtype: float32         # Ivy Bridge has no bf16 path worth using
  device: cpu
  num_threads: 4
  log_every: 5
  eval_every: 25
  eval_batches: 12
  save_every: 25
