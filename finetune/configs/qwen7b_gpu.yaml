# Production-scale domain fine-tune. 1x A100-80G or 2x A6000, a few hours, ~$20-60.
# For 7B in 24 GB you would add 4-bit quantisation of the frozen base (QLoRA);
# this repo does not implement that — see README "Known gaps".
name: qwen7b
base_model: Qwen/Qwen2.5-7B-Instruct

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  train_embeddings: false

data:
  train_file: data/train.jsonl
  val_file: data/val.jsonl
  max_len: 2048
  on_overflow: drop
  mask_prompt: true

train:
  out_dir: runs/qwen7b
  epochs: 2.0
  micro_batch: 2
  grad_accum: 16
  lr: 5.0e-5
  warmup_frac: 0.03
  dtype: bfloat16
  device: cuda
  log_every: 10
  eval_every: 100
  eval_batches: 30
  save_every: 200
